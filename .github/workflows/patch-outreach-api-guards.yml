name: Enforce LeadAI outbound API controls

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-outreach-api-guards.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch outbound integration guards
        run: |
          node <<'NODE'
          const fs = require('fs')
          const p = 'src/lib/outreach.functions.ts'
          let s = fs.readFileSync(p, 'utf8')
          const importAnchor = "import { createHandoffInternal } from '@/lib/sales-actions.functions'"
          if (!s.includes("assertIntegrationOperational")) {
            s = s.replace(importAnchor, importAnchor + "\nimport { assertIntegrationOperational } from '@/lib/integration-control.functions'")
          }

          // Guard cadence calls. Sandbox permits provider testing only for contacts marked sandbox;
          // production requires the integration row itself to be in Real mode.
          const contentAnchor = `  const content = step.template\n    ? renderTemplate(step.template, lead)\n    : await generateOutreachMessage(ctx, lead, channel)`
          const contentReplacement = `  const { data: runtimeSettings } = await (ctx.supabase as any).from('company_settings')\n    .select('sandbox_mode')\n    .eq('organization_id', lead.organization_id)\n    .limit(1)\n    .maybeSingle()\n  const sandboxMode = Boolean(runtimeSettings?.sandbox_mode)\n  if (channel === 'whatsapp' || channel === 'email') {\n    await assertIntegrationOperational({ ...ctx, organizationId: lead.organization_id } as any, channel === 'whatsapp' ? 'whatsapp' : 'email', { requireReal: !sandboxMode })\n  }\n  if (!step.template && !sandboxMode) {\n    await assertIntegrationOperational({ ...ctx, organizationId: lead.organization_id } as any, 'ai', { requireReal: true })\n  }\n\n  const content = step.template\n    ? renderTemplate(step.template, lead)\n    : await generateOutreachMessage(ctx, lead, channel)`
          if (s.includes(contentAnchor)) s = s.replace(contentAnchor, contentReplacement)

          // Guard automatic replies/handoff bridge before external delivery.
          const deliveryAnchor = `  const channel = delivery.channel ?? 'whatsapp'\n  const result = channel === 'email'`
          const deliveryReplacement = `  const channel = delivery.channel ?? 'whatsapp'\n  const { data: runtimeSettings } = await (ctx.supabase as any).from('company_settings')\n    .select('sandbox_mode')\n    .eq('organization_id', lead.organization_id)\n    .limit(1)\n    .maybeSingle()\n  await assertIntegrationOperational({ ...ctx, organizationId: lead.organization_id } as any, channel === 'email' ? 'email' : 'whatsapp', { requireReal: !Boolean(runtimeSettings?.sandbox_mode) })\n  const result = channel === 'email'`
          if (s.includes(deliveryAnchor)) s = s.replace(deliveryAnchor, deliveryReplacement)

          // Guard Anthropic for inbound AI handling; if unavailable, safely hand off to a human.
          const aiAnchor = `  const apiKey = process.env.ANTHROPIC_API_KEY\n  if (!apiKey) return handoffInbound(ctx, lead, userText, 'IA indisponível', true, delivery)`
          const aiReplacement = `  const apiKey = process.env.ANTHROPIC_API_KEY\n  if (!apiKey) return handoffInbound(ctx, lead, userText, 'IA indisponível', true, delivery)\n  try {\n    await assertIntegrationOperational({ ...ctx, organizationId: lead.organization_id } as any, 'ai', { requireReal: true })\n  } catch (error) {\n    return handoffInbound(ctx, lead, userText, error instanceof Error ? error.message : 'IA pausada ou desativada', true, delivery)\n  }`
          if (s.includes(aiAnchor)) s = s.replace(aiAnchor, aiReplacement)

          // Guard human manual WhatsApp sends as well.
          const manualAnchor = `    const to = lead.whatsapp || lead.phone || ''\n    if (!to) return { ok: false, error: 'O lead não possui WhatsApp ou telefone cadastrado.' }`
          const manualReplacement = `    const to = lead.whatsapp || lead.phone || ''\n    if (!to) return { ok: false, error: 'O lead não possui WhatsApp ou telefone cadastrado.' }\n    const { data: runtimeSettings } = await (ctx.supabase as any).from('company_settings')\n      .select('sandbox_mode')\n      .eq('organization_id', lead.organization_id)\n      .limit(1)\n      .maybeSingle()\n    try {\n      await assertIntegrationOperational({ ...ctx, organizationId: lead.organization_id } as any, 'whatsapp', { requireReal: !Boolean(runtimeSettings?.sandbox_mode) })\n    } catch (error) {\n      return { ok: false, error: error instanceof Error ? error.message : 'WhatsApp indisponível.' }\n    }`
          if (s.includes(manualAnchor)) s = s.replace(manualAnchor, manualReplacement)

          fs.writeFileSync(p, s)
          NODE
      - name: Commit outbound guards
        run: |
          git config user.name "LeadAI Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/lib/outreach.functions.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(outreach): honor API pause and environment controls"
          git push origin main

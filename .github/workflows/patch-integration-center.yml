name: Wire LeadAI integration center

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-integration-center.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wire central API management into Configuracoes
        run: |
          node <<'NODE'
          const fs = require('fs')
          const p = 'src/routes/_authenticated/configuracoes.tsx'
          let s = fs.readFileSync(p, 'utf8')
          const anchor = 'import { CompanySettingsPanel } from "@/components/CompanySettingsPanel";'
          if (!s.includes('IntegrationControlPanel')) {
            s = s.replace(anchor, anchor + '\nimport { IntegrationControlPanel } from "@/components/IntegrationControlPanel";')
          }
          s = s.replace('{tab === "integracoes" && <AbaInt />}', '{tab === "integracoes" && <AbaIntegracoesCentral />}')
          const marker = 'function AbaInt() {'
          if (!s.includes('function AbaIntegracoesCentral()')) {
            const central = `function AbaIntegracoesCentral() {\n  const settingsFn = useServerFn(getCompanySettings);\n  const { data: settings } = useQuery({ queryKey: ["company-settings"], queryFn: () => settingsFn() });\n  const sandbox = (settings as any)?.sandbox_mode !== false;\n  return (\n    <div className="space-y-4">\n      <IntegrationControlPanel />\n      <Card>\n        <SectionTitle title="Operação dos canais" hint="Cadência, handoff e conexão de agenda permanecem disponíveis abaixo da Central de APIs." />\n        <ZapiCadenceCard />\n        <SequenceEditorCard />\n        <HandoffAutomationCard />\n        <GoogleCalendarCard sandbox={sandbox} />\n      </Card>\n    </div>\n  );\n}\n\n`
            s = s.replace(marker, central + marker)
          }
          if (!s.includes('<IntegrationControlPanel />')) throw new Error('IntegrationControlPanel wiring failed')
          fs.writeFileSync(p, s)
          NODE
      - name: Typecheck and build
        run: |
          corepack enable
          npm install --ignore-scripts
          npx tsc --noEmit
          npm run build
      - name: Commit wiring
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "LeadAI Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/routes/_authenticated/configuracoes.tsx
          git commit -m "feat(integrations): replace legacy status screen with control center"
          git push origin main
